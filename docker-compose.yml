name: tpc-postgres

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Docker's default 64 MB /dev/shm makes parallel queries fail with
    # "could not resize shared memory segment".
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tuned for bulk loading and analytic queries on a laptop; adjust in .env.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-64MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL_WORKERS:-4}
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-off: `docker compose run --rm loader <command>` (the Makefile wraps this).
  loader:
    build: ./loader
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      READER_USER: ${READER_USER:-reader}
      READER_PASSWORD: ${READER_PASSWORD:-reader}
      TPCH_SCALE: ${TPCH_SCALE:-1}
      TPCDS_SCALE: ${TPCDS_SCALE:-1}
      PRESET: ${PRESET:-}
      KEEP_SCALES: ${KEEP_SCALES:-false}
      FORCE: ${FORCE:-}
      LOADER_MEMORY_LIMIT: ${LOADER_MEMORY_LIMIT:-4GB}
      LOADER_THREADS: ${LOADER_THREADS:-}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-300}
    volumes:
      - ./:/repo
      - loader-work:/work

volumes:
  pgdata:
  loader-work:
